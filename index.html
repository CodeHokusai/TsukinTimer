<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <title>通勤タイマー</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      width: 100%;
    }

    .header h1 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #a0c4ff;
      letter-spacing: 0.05em;
    }

    .toggle-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .toggle-btn-pair {
      display: flex;
      background: #16213e;
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
      max-width: 180px;
    }

    .toggle-btn-pair.three {
      max-width: 240px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #8899aa;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .toggle-btn.active {
      background: #0f3460;
      color: #ffffff;
      font-weight: 700;
    }

    .route-label {
      text-align: center;
      font-size: 0.85rem;
      color: #7888a0;
      margin-bottom: 16px;
    }

    .route-label .station {
      color: #a0c4ff;
      font-weight: 600;
    }

    .next-train-card {
      background: linear-gradient(135deg, #0f3460, #16213e);
      border: 1px solid #1a4080;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 12px;
    }

    .next-train-card .label {
      font-size: 0.8rem;
      color: #7888a0;
      margin-bottom: 8px;
    }

    .next-train-card .time-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }

    .next-train-card .departure-time {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .next-train-card .train-type {
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .next-train-card .train-dest {
      font-size: 0.85rem;
      color: #a0b0c0;
    }

    .next-train-card .countdown {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffd166;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }

    .next-train-card .countdown.urgent {
      color: #ef476f;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .upcoming-list {
      width: 100%;
      max-width: 400px;
    }

    .upcoming-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16213e;
      border-radius: 12px;
      margin-bottom: 5px;
    }

    .upcoming-item .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upcoming-item .dep-time {
      font-size: 1.1rem;
      font-weight: 600;
      color: #d0d8e0;
      font-variant-numeric: tabular-nums;
      min-width: 50px;
    }

    .train-type {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .train-type.local {
      background: #2d4a22;
      color: #8bc34a;
    }

    .train-type.express {
      background: #4a2222;
      color: #ef5350;
    }

    .train-type.rapid {
      background: #22404a;
      color: #4fc3f7;
    }

    .upcoming-item .dest {
      font-size: 0.8rem;
      color: #8090a0;
    }

    .upcoming-item .remaining {
      font-size: 1rem;
      font-weight: 600;
      color: #a0c4ff;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* 利用不可電車のグレーアウト（品川不可 / 新柴又通過） */
    .next-train-card.unavailable {
      opacity: 0.5;
      border-color: #333;
    }

    .next-train-card.unavailable .unavailable-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #553322;
      color: #ff9966;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .upcoming-item.unavailable {
      opacity: 0.45;
    }

    .upcoming-item .unavailable-badge {
      font-size: 0.65rem;
      background: #553322;
      color: #ff9966;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
    }

    .current-time {
      text-align: center;
      padding: 20px 0;
      font-size: 0.85rem;
      color: #556070;
      width: 100%;
    }

    .current-time .time {
      font-size: 1rem;
      color: #7888a0;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .no-trains {
      text-align: center;
      padding: 40px 20px;
      color: #556070;
      font-size: 1rem;
      width: 100%;
      max-width: 400px;
    }

    .no-trains .icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    /* 帰り(inbound)背景のみ暖色 */
    body.inbound { background: #3d2a1a; }

    /* Safe area for iPhone notch */
    @supports (padding-top: env(safe-area-inset-top)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>通勤タイマー</h1>
  </div>

  <div class="toggle-group">
    <div class="toggle-btn-pair">
      <button class="toggle-btn active" id="btn-outbound" onclick="setDirection('outbound')">行き</button>
      <button class="toggle-btn" id="btn-inbound" onclick="setDirection('inbound')">帰り</button>
    </div>
    <div class="toggle-btn-pair three">
      <button class="toggle-btn active" id="btn-weekday" onclick="setDayType('weekday')">平日</button>
      <button class="toggle-btn" id="btn-saturday" onclick="setDayType('saturday')">土曜</button>
      <button class="toggle-btn" id="btn-holiday" onclick="setDayType('holiday')">休日</button>
    </div>
  </div>

  <div class="route-label" id="route-label"></div>

  <div id="train-display"></div>

  <div class="current-time">
    現在時刻 <span class="time" id="current-time-display">--:--:--</span>
  </div>

  <script src="timetable.js"></script>
  <script>
    let direction = "outbound";
    let dayType = "weekday";

    // 曜日自動判定（0=日, 6=土）
    function autoDetectDayType() {
      const day = new Date().getDay();
      if (day === 6) return "saturday";
      if (day === 0) return "holiday";
      return "weekday";
    }

    // 時間帯で行き/帰りを自動判定（16:00〜2:59→帰り、3:00〜15:59→行き）
    function autoDetectDirection() {
      const hour = new Date().getHours();
      if (hour >= 16 || hour < 3) return "inbound";
      return "outbound";
    }

    // 初期化時に自動判定
    dayType = autoDetectDayType();
    direction = autoDetectDirection();
    updateToggleUI();

    function setDirection(dir) {
      direction = dir;
      updateToggleUI();
      updateDisplay();
    }

    function setDayType(type) {
      dayType = type;
      updateToggleUI();
      updateDisplay();
    }

    function updateToggleUI() {
      document.body.classList.toggle("inbound", direction === "inbound");
      document.getElementById("btn-outbound").classList.toggle("active", direction === "outbound");
      document.getElementById("btn-inbound").classList.toggle("active", direction === "inbound");
      document.getElementById("btn-weekday").classList.toggle("active", dayType === "weekday");
      document.getElementById("btn-saturday").classList.toggle("active", dayType === "saturday");
      document.getElementById("btn-holiday").classList.toggle("active", dayType === "holiday");
    }

    function getTrainTypeClass(type) {
      if (type === "急行" || type === "快速急行" || type === "快特" || type === "特急" || type === "ア特急" || type === "通勤特急") return "express";
      if (type === "快速" || type === "通勤快速") return "rapid";
      return "local";
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function getNextTrains(now) {
      const data = TIMETABLE[direction][dayType];
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const nowSeconds = now.getSeconds();
      const nowTotalSec = nowMinutes * 60 + nowSeconds;

      const upcoming = [];
      for (const train of data) {
        const trainMinutes = timeToMinutes(train.time);
        const trainTotalSec = trainMinutes * 60;
        const diffSec = trainTotalSec - nowTotalSec;
        if (diffSec > -60) { // 1分前まで含める（ちょうど出発する電車も表示）
          upcoming.push({
            ...train,
            diffSec: Math.max(diffSec, 0),
            diffMin: Math.max(Math.ceil(diffSec / 60), 0),
          });
        }
        if (upcoming.length >= 6) break;
      }
      return upcoming;
    }

    function formatCountdown(diffSec) {
      if (diffSec <= 0) return "まもなく発車";
      const min = Math.floor(diffSec / 60);
      const sec = diffSec % 60;
      if (min >= 60) {
        const h = Math.floor(min / 60);
        const m = min % 60;
        return `あと ${h}時間${m}分`;
      }
      return `あと ${min}分${sec.toString().padStart(2, "0")}秒`;
    }

    function formatRemaining(diffSec) {
      if (diffSec <= 0) return "まもなく";
      const min = Math.ceil(diffSec / 60);
      if (min >= 60) {
        const h = Math.floor(min / 60);
        const m = min % 60;
        return `${h}時間${m}分`;
      }
      return `${min}分`;
    }

    function updateDisplay() {
      const now = new Date();
      const label = TIMETABLE[direction].label;
      document.getElementById("route-label").innerHTML =
        `<span class="station">${label.from}</span> → <span class="station">${label.to}</span>`;

      const timeStr = now.toLocaleTimeString("ja-JP", { hour12: false });
      document.getElementById("current-time-display").textContent = timeStr;

      const trains = getNextTrains(now);
      const container = document.getElementById("train-display");

      if (trains.length === 0) {
        container.innerHTML = `
          <div class="no-trains">
            <div class="icon">🌙</div>
            本日の運行は終了しました
          </div>`;
        return;
      }

      const first = trains[0];
      const isUrgent = first.diffSec <= 180; // 3分以内

      // 方向に応じて利用不可判定を切替
      function isUnavailable(train) {
        if (direction === "outbound") return train.via_shinagawa === false;
        return train.stops_shibamata === false;
      }
      const badgeText = direction === "outbound" ? "品川不可" : "新柴又通過";
      const firstUnavail = isUnavailable(first);

      let html = `
        <div class="next-train-card${firstUnavail ? " unavailable" : ""}">
          <div class="label">次の電車</div>
          <div class="time-row">
            <span class="departure-time">${first.time}</span>
            <span class="train-type ${getTrainTypeClass(first.type)}">${first.type}</span>
            <span class="train-dest">${first.dest}行${firstUnavail ? `<span class="unavailable-badge">${badgeText}</span>` : ""}</span>
          </div>
          <div class="countdown ${isUrgent ? "urgent" : ""}">${formatCountdown(first.diffSec)}</div>
        </div>
        <div class="upcoming-list">`;

      for (let i = 1; i < trains.length; i++) {
        const t = trains[i];
        const unavail = isUnavailable(t);
        html += `
          <div class="upcoming-item${unavail ? " unavailable" : ""}">
            <div class="left">
              <span class="dep-time">${t.time}</span>
              <span class="train-type ${getTrainTypeClass(t.type)}">${t.type}</span>
              <span class="dest">${t.dest}行${unavail ? `<span class="unavailable-badge">${badgeText}</span>` : ""}</span>
            </div>
            <span class="remaining">${formatRemaining(t.diffSec)}</span>
          </div>`;
      }

      html += "</div>";
      container.innerHTML = html;
    }

    // 1秒ごとに更新
    updateDisplay();
    setInterval(updateDisplay, 1000);

    // Service Worker登録
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>

</body>
</html>
